services:
  openalgo:
    image: openalgo:latest
    build:
      context: .
      dockerfile: Dockerfile

    # NOTE: no "container_name" — let Coolify manage container naming
    # NOTE: no "ports:" mapping — Traefik (Coolify's proxy) routes
    # traffic internally to the ports declared below via "expose"

    expose:
      - "5000"
      - "8765"

    volumes:
      - openalgo_db:/app/db
      - openalgo_log:/app/log
      - openalgo_strategies:/app/strategies
      - openalgo_keys:/app/keys
      - openalgo_tmp:/app/tmp

    environment:
      # ── Core Flask settings ──────────────────────────────────
      - FLASK_HOST_IP=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - TZ=Asia/Kolkata

      # ── Must exactly match your custom domain ────────────────
      - HOST_SERVER=${HOST_SERVER}

      # ── OAuth redirect — MUST end with /<broker>/callback ────
      # Example: https://openalgo.yourdomain.com/zerodha/callback
      # This same URL must also be registered in your broker's
      # developer/app console, exactly matching (scheme, domain,
      # broker slug, no trailing slash).
      - REDIRECT_URL=${REDIRECT_URL}

      # ── WebSocket settings ────────────────────────────────────
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8765
      - WEBSOCKET_URL=${WEBSOCKET_URL}

      # ── Internal ZeroMQ (not exposed publicly) ───────────────
      - ZMQ_HOST=0.0.0.0
      - ZMQ_PORT=5555

      # ── Database ──────────────────────────────────────────────
      - DATABASE_URL=sqlite:///db/openalgo.db

      # ── Security keys ─────────────────────────────────────────
      # NEVER change APP_KEY/API_KEY_PEPPER/FERNET_SALT once set
      # on a live install with existing users/broker logins —
      # doing so makes existing password hashes / encrypted
      # broker tokens permanently unrecoverable.
      - APP_KEY=${APP_KEY}
      - API_KEY_PEPPER=${API_KEY_PEPPER}
      - FERNET_SALT=${FERNET_SALT}

      # ── Config version tracker (bump only when app requires it,
      #    per the "CONFIGURATION UPDATE REQUIRED" startup banner) ─
      - ENV_CONFIG_VERSION=${ENV_CONFIG_VERSION:-1.0.7}

      # ── Broker API credentials ────────────────────────────────
      - BROKER_API_KEY=${BROKER_API_KEY}
      - BROKER_API_SECRET=${BROKER_API_SECRET}
      # Uncomment if your broker needs separate market-data creds
      # (e.g. XTS-based brokers):
      # - BROKER_API_KEY_MARKET=${BROKER_API_KEY_MARKET}
      # - BROKER_API_SECRET_MARKET=${BROKER_API_SECRET_MARKET}

      # ── Thread limits (prevents container crashes) ───────────
      # See: https://github.com/marketcalls/openalgo/issues/822
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-2}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-2}
      - NUMEXPR_NUM_THREADS=${NUMEXPR_NUM_THREADS:-2}
      - NUMBA_NUM_THREADS=${NUMBA_NUM_THREADS:-2}
      - STRATEGY_MEMORY_LIMIT_MB=${STRATEGY_MEMORY_LIMIT_MB:-1024}

    shm_size: ${SHM_SIZE:-512m}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/auth/check-setup"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

volumes:
  openalgo_db:
    driver: local
  openalgo_log:
    driver: local
  openalgo_strategies:
    driver: local
  openalgo_keys:
    driver: local
  openalgo_tmp:
    driver: local
