services:
  openalgo:
    image: marketcalls/openalgo:latest

    expose:
      - "5000"
      - "8765"

    volumes:
      - openalgo_db:/app/db
      - openalgo_log:/app/log
      - openalgo_strategies:/app/strategies
      - openalgo_keys:/app/keys
      - openalgo_tmp:/app/tmp

    environment:
      # Core Flask
      FLASK_HOST_IP: "0.0.0.0"
      FLASK_PORT: "5000"
      FLASK_ENV: "${FLASK_ENV:-production}"
      FLASK_DEBUG: "${FLASK_DEBUG:-0}"
      TZ: "Asia/Kolkata"

      # Public OpenAlgo URL
      HOST_SERVER: "${HOST_SERVER}"

      # Broker OAuth callback
      REDIRECT_URL: "${REDIRECT_URL}"

      # WebSocket
      WEBSOCKET_HOST: "0.0.0.0"
      WEBSOCKET_PORT: "8765"
      WEBSOCKET_URL: "${WEBSOCKET_URL}"

      # Internal ZeroMQ
      ZMQ_HOST: "127.0.0.1"
      ZMQ_PORT: "5555"

      # Database
      DATABASE_URL: "sqlite:///db/openalgo.db"

      # Security
      APP_KEY: ${APP_KEY}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      
      # Configuration version
      ENV_CONFIG_VERSION: "${ENV_CONFIG_VERSION:-1.0.7}"

      # Broker
      BROKER_API_KEY: "${BROKER_API_KEY}"
      BROKER_API_SECRET: "${BROKER_API_SECRET}"

      # Optional market-data credentials
      BROKER_API_KEY_MARKET: "${BROKER_API_KEY_MARKET:-}"
      BROKER_API_SECRET_MARKET: "${BROKER_API_SECRET_MARKET:-}"

      # Performance
      OPENBLAS_NUM_THREADS: "${OPENBLAS_NUM_THREADS:-2}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-2}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-2}"
      NUMEXPR_NUM_THREADS: "${NUMEXPR_NUM_THREADS:-2}"
      NUMBA_NUM_THREADS: "${NUMBA_NUM_THREADS:-2}"

      STRATEGY_MEMORY_LIMIT_MB: "${STRATEGY_MEMORY_LIMIT_MB:-1024}"

      # Reverse proxy
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-TRUE}"

      # CORS
      CORS_ENABLED: "${CORS_ENABLED:-TRUE}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"

      # No ngrok
      NGROK_ALLOW: "${NGROK_ALLOW:-FALSE}"

    shm_size: "${SHM_SIZE:-1g}"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:5000/auth/check-setup"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

volumes:
  openalgo_db:
    driver: local

  openalgo_log:
    driver: local

  openalgo_strategies:
    driver: local

  openalgo_keys:
    driver: local

  openalgo_tmp:
    driver: local
