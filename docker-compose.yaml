services:
  openalgo:
    image: openalgo:latest
    build:
      context: .
      dockerfile: Dockerfile

    # NOTE: no "container_name" — let Coolify manage container naming
    # NOTE: no "ports:" mapping — Traefik (Coolify's proxy) will route
    # traffic internally to the ports declared below via "expose"

    expose:
      - "5000"
      - "8765"

    volumes:
      - openalgo_db:/app/db
      - openalgo_log:/app/log
      - openalgo_strategies:/app/strategies
      - openalgo_keys:/app/keys
      - openalgo_tmp:/app/tmp

    environment:
      # ── Coolify magic variables ──────────────────────────────
      # These tell Coolify/Traefik to generate an HTTPS domain for
      # EACH port. After first deploy, replace the auto-generated
      # sslip.io domains with your own custom domain in the
      # "Domains" section of this resource in the Coolify UI.
      - SERVICE_FQDN_OPENALGO_5000
      - SERVICE_FQDN_OPENALGO_8765

      # ── Core Flask settings ──────────────────────────────────
      - FLASK_HOST_IP=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - TZ=Asia/Kolkata

      # ── IMPORTANT: must exactly match your custom domain ─────
      - HOST_SERVER=${HOST_SERVER}

      # ── WebSocket settings ────────────────────────────────────
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8765
      - WEBSOCKET_URL=${WEBSOCKET_URL}

      # ── Internal ZeroMQ (not exposed publicly) ───────────────
      - ZMQ_HOST=0.0.0.0
      - ZMQ_PORT=5555

      # ── Database ──────────────────────────────────────────────
      - DATABASE_URL=sqlite:///db/openalgo.db

      # ── Security keys — set real values in Coolify's           
      #    "Environment Variables" tab, never commit them to git ─
      - APP_KEY=${APP_KEY}
      - API_KEY_PEPPER=${API_KEY_PEPPER}

      # ── Broker API credentials — set in Coolify UI ───────────
      - BROKER_API_KEY=${BROKER_API_KEY}
      - BROKER_API_SECRET=${BROKER_API_SECRET}
      # Uncomment if your broker needs separate market-data creds
      # (e.g. XTS-based brokers):
      # - BROKER_API_KEY_MARKET=${BROKER_API_KEY_MARKET}
      # - BROKER_API_SECRET_MARKET=${BROKER_API_SECRET_MARKET}

      # ── Thread limits (prevents container crashes) ───────────
      # See: https://github.com/marketcalls/openalgo/issues/822
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-2}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-2}
      - NUMEXPR_NUM_THREADS=${NUMEXPR_NUM_THREADS:-2}
      - NUMBA_NUM_THREADS=${NUMBA_NUM_THREADS:-2}
      - STRATEGY_MEMORY_LIMIT_MB=${STRATEGY_MEMORY_LIMIT_MB:-1024}

    shm_size: ${SHM_SIZE:-512m}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/auth/check-setup"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

volumes:
  openalgo_db:
    driver: local
  openalgo_log:
    driver: local
  openalgo_strategies:
    driver: local
  openalgo_keys:
    driver: local
  openalgo_tmp:
    driver: local
